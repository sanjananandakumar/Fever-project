<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FeverSense | Register</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e7f5f2,#fff0dc);color:#18212f}.box{width:420px;max-width:92%;background:#fff;padding:38px;border-radius:25px;box-shadow:0 20px 60px rgba(21,38,58,.14)}.mark{width:64px;height:64px;margin:auto;border-radius:18px;background:#fff0dc;display:grid;place-items:center;font-size:30px}.box h1{text-align:center;margin:18px 0 7px}.sub{text-align:center;color:#667085;margin-bottom:25px}label{display:block;margin:13px 0 7px;font-weight:700;font-size:14px}input{width:100%;padding:13px;border:1px solid #d6dae0;border-radius:11px;font-size:15px}input:focus{outline:none;border-color:#087f8c}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:#087f8c;color:#fff;font-weight:800;cursor:pointer}.error{margin-top:14px;padding:11px;border-radius:9px;background:#fff1f0;color:#b42318;font-size:13px}.switch{text-align:center;margin-top:20px;color:#667085;font-size:14px}.switch a{color:#087f8c;font-weight:800;text-decoration:none}</style></head><body><div class="box"><div class="mark">+</div><h1>Create your account</h1><p class="sub">Start using FeverSense</p><form method="POST"><label>Full name</label><input type="text" name="name" placeholder="Enter your name" required><label>Email</label><input type="email" name="email" placeholder="Enter your email" required><label>Password</label><input type="password" name="password" placeholder="At least 6 characters" minlength="6" required><label>Confirm password</label><input type="password" name="confirm_password" placeholder="Repeat your password" required><button type="submit">Create Account →</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div></div></body></html>
