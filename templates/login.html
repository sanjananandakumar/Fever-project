<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FeverSense | Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e7f5f2,#fff0dc);color:#18212f}.box{width:420px;max-width:92%;background:#fff;padding:40px;border-radius:25px;box-shadow:0 20px 60px rgba(21,38,58,.14)}.mark{width:72px;height:72px;margin:auto;border-radius:20px;background:#dff4ef;display:grid;place-items:center;font-size:38px;color:#087f8c}.box h1{text-align:center;margin:20px 0 7px}.sub{text-align:center;color:#667085;margin-bottom:28px}label{display:block;margin:16px 0 7px;font-weight:700;font-size:14px}input{width:100%;padding:14px;border:1px solid #d6dae0;border-radius:11px;font-size:15px}input:focus{outline:none;border-color:#087f8c;box-shadow:0 0 0 3px rgba(8,127,140,.1)}button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:11px;background:#087f8c;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.error{margin-top:15px;padding:12px;border-radius:10px;background:#fff1f0;color:#b42318;font-size:13px}.switch{text-align:center;margin-top:22px;color:#667085;font-size:14px}.switch a{color:#087f8c;font-weight:800;text-decoration:none}.demo{margin-top:20px;padding:12px;border-radius:10px;background:#f6f4ef;color:#667085;font-size:12px;line-height:1.6}</style></head><body><div class="box"><div class="mark">♥</div><h1>Welcome to FeverSense</h1><p class="sub">Sign in to run a fever prediction</p><form method="POST"><label>Email</label><input type="email" name="email" placeholder="Enter your email" required><label>Password</label><input type="password" name="password" placeholder="Enter your password" required><button type="submit">Sign In →</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}<div class="switch">New user? <a href="{{ url_for('register') }}">Create an account</a></div><div class="demo"><b>Demo account</b><br>Email: demo@example.com<br>Password: Fever@1234</div></div></body></html>
